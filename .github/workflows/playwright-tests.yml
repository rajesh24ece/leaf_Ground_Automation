name: Playwright Tests

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  test:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.59.1-noble

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install Dependencies
        run: npm ci

      - name: Create Environment File
        run: |
          echo "BASE_URL=${{ secrets.BASE_URL }}" > .env.leafground
          echo "WORKERS=1" >> .env.leafground
          echo "CI=true" >> .env.leafground

      - name: Run Playwright Tests
        run: npx playwright test
        env:
          HOME: /root

      - name: Parse Test Results
        if: always()
        id: test-results
        run: |
          node << 'SCRIPT'
          const fs = require('fs');

          const filePath = 'test-results/test-results.json';

          if (!fs.existsSync(filePath)) {
            console.log('test-results.json not found, writing zeros');
            const output = [
              'total=0',
              'passed=0',
              'failed=0',
              'flaky=0',
              'skipped=0',
              'percentage=0.0'
            ].join('\n');
            fs.appendFileSync(process.env.GITHUB_OUTPUT, output + '\n');
            process.exit(0);
          }

          const data = JSON.parse(fs.readFileSync(filePath, 'utf8'));
          const stats = data.stats;

          const total = stats.expected + stats.unexpected + stats.flaky + stats.skipped;
          const passed = stats.expected;
          const failed = stats.unexpected;
          const flaky = stats.flaky;
          const skipped = stats.skipped;
          const percentage = total > 0 ? ((passed / total) * 100).toFixed(1) : '0.0';

          const output = [
            `total=${total}`,
            `passed=${passed}`,
            `failed=${failed}`,
            `flaky=${flaky}`,
            `skipped=${skipped}`,
            `percentage=${percentage}`
          ].join('\n');

          fs.appendFileSync(process.env.GITHUB_OUTPUT, output + '\n');
          console.log('Written to GITHUB_OUTPUT:\n' + output);
          SCRIPT

      - name: Upload Playwright HTML Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          retention-days: 30

      - name: Install Java for Allure
        if: always()
        run: |
          apt-get update && apt-get install -y default-jre
          java -version

      - name: Generate Allure HTML Report
        if: always()
        run: npx allure generate allure-results --clean -o allure-report

      - name: Upload Allure Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results/
          retention-days: 30

      - name: Upload Allure HTML Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report/
          retention-days: 30

      - name: Notify Slack
        if: always()
        uses: slackapi/slack-github-action@v2.1.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": "*Playwright Tests — ${{ job.status == 'success' && '✅ All Passed' || '❌ Some Failed' }}*",
              "attachments": [
                {
                  "color": "${{ job.status == 'success' && 'good' || 'danger' }}",
                  "fields": [
                    { "title": "Repository", "value": "${{ github.repository }}", "short": true },
                    { "title": "Branch", "value": "${{ github.ref_name }}", "short": true },
                    { "title": "Triggered by", "value": "${{ github.actor }}", "short": true },
                    { "title": "Run", "value": "<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Run>", "short": true },
                    { "title": "🔢 Total", "value": "${{ steps.test-results.outputs.total }}", "short": true },
                    { "title": "✅ Passed", "value": "${{ steps.test-results.outputs.passed }}", "short": true },
                    { "title": "❌ Failed", "value": "${{ steps.test-results.outputs.failed }}", "short": true },
                    { "title": "⚠️ Flaky", "value": "${{ steps.test-results.outputs.flaky }}", "short": true },
                    { "title": "⏭️ Skipped", "value": "${{ steps.test-results.outputs.skipped }}", "short": true },
                    { "title": "📊 Success Rate", "value": "${{ steps.test-results.outputs.percentage }}%", "short": true }
                  ]
                }
              ]
            }
