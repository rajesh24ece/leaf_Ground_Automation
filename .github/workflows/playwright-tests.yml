name: Playwright Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # --------------------------------------------------
      # 1. Checkout
      # --------------------------------------------------
      - name: Checkout code
        uses: actions/checkout@v4

      # --------------------------------------------------
      # 2. Setup Node.js
      # --------------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # --------------------------------------------------
      # 3. Install dependencies
      # --------------------------------------------------
      - name: Install dependencies
        run: npm ci

      # --------------------------------------------------
      # 4. Get Playwright version
      # --------------------------------------------------
      - name: Get Playwright version
        id: playwright-version
        shell: bash
        run: |
          echo "version=$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test'].version")" >> "$GITHUB_OUTPUT"

      # --------------------------------------------------
      # 5. Cache Playwright browsers
      # --------------------------------------------------
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      # --------------------------------------------------
      # 6. Install Playwright browsers
      # --------------------------------------------------
      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps

      # --------------------------------------------------
      # 7. Install OS dependencies if browser cache exists
      # --------------------------------------------------
      - name: Install Playwright OS dependencies only
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps

      # --------------------------------------------------
      # 8. Run Playwright tests
      # --------------------------------------------------
      - name: Run Playwright tests
        id: playwright-tests
        continue-on-error: true
        run: npx playwright test
        env:
          CI: true
          BASE_URL: ${{ secrets.BASE_URL }}

      # --------------------------------------------------
      # 9. Read Playwright JSON results
      # --------------------------------------------------
      - name: Calculate test results
        id: test-results
        if: always()
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');

          const possibleFiles = [
            'test-results.json',
            'playwright-report/results.json',
            'results.json'
          ];

          const resultFile = possibleFiles.find(file => fs.existsSync(file));

          if (!resultFile) {
            console.log('Playwright JSON result file not found.');

            fs.appendFileSync(process.env.GITHUB_OUTPUT, `
          total=0
          passed=0
          failed=0
          flaky=0
          skipped=0
          success_rate=0
          `);

            process.exit(0);
          }

          console.log(`Reading: ${resultFile}`);

          const data = JSON.parse(fs.readFileSync(resultFile, 'utf8'));

          let total = 0;
          let passed = 0;
          let failed = 0;
          let flaky = 0;
          let skipped = 0;

          function processSuite(suite) {
            if (!suite) return;

            if (suite.specs) {
              for (const spec of suite.specs) {
                if (!spec.tests) continue;

                for (const test of spec.tests) {
                  total++;

                  const results = test.results || [];

                  const hasPassed = results.some(
                    r => r.status === 'passed'
                  );

                  const hasFailed = results.some(
                    r => r.status === 'failed' ||
                         r.status === 'timedOut'
                  );

                  const hasSkipped = results.some(
                    r => r.status === 'skipped'
                  );

                  const hasRetry =
                    results.length > 1;

                  if (hasFailed) {
                    failed++;
                  } else if (hasPassed && hasRetry) {
                    flaky++;
                  } else if (hasPassed) {
                    passed++;
                  } else if (hasSkipped) {
                    skipped++;
                  }
                }
              }
            }

            if (suite.suites) {
              for (const childSuite of suite.suites) {
                processSuite(childSuite);
              }
            }
          }

          processSuite(data);

          const executed = passed + failed + flaky;

          const successRate =
            total > 0
              ? ((passed + flaky) / total * 100).toFixed(1)
              : '0.0';

          fs.appendFileSync(
            process.env.GITHUB_OUTPUT,
            `total=${total}\n`
          );

          fs.appendFileSync(
            process.env.GITHUB_OUTPUT,
            `passed=${passed}\n`
          );

          fs.appendFileSync(
            process.env.GITHUB_OUTPUT,
            `failed=${failed}\n`
          );

          fs.appendFileSync(
            process.env.GITHUB_OUTPUT,
            `flaky=${flaky}\n`
          );

          fs.appendFileSync(
            process.env.GITHUB_OUTPUT,
            `skipped=${skipped}\n`
          );

          fs.appendFileSync(
            process.env.GITHUB_OUTPUT,
            `success_rate=${successRate}\n`
          );

          console.log('--------------------------------');
          console.log(`Total       : ${total}`);
          console.log(`Passed      : ${passed}`);
          console.log(`Failed      : ${failed}`);
          console.log(`Flaky       : ${flaky}`);
          console.log(`Skipped     : ${skipped}`);
          console.log(`Success Rate: ${successRate}%`);
          console.log('--------------------------------');
          NODE

      # --------------------------------------------------
      # 10. Upload HTML report
      # --------------------------------------------------
      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-html-report
          path: playwright-report/
          retention-days: 30

      # --------------------------------------------------
      # 11. Upload Allure results
      # --------------------------------------------------
      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results/
          retention-days: 30

      # --------------------------------------------------
      # 12. Upload test results
      # --------------------------------------------------
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          retention-days: 30

      # --------------------------------------------------
      # 13. Send detailed Slack notification
      # --------------------------------------------------
      - name: Send Slack Notification
        if: always()
        uses: slackapi/slack-github-action@v4.0.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            text: |
              Playwright Notifications

              ${{ steps.playwright-tests.outcome == 'success' && ':white_check_mark:' || ':x:' }} Playwright Tests — ${{ steps.playwright-tests.outcome == 'success' && 'All Passed' || 'Tests Failed' }}

              *Repository:*
              ${{ github.repository }}

              *Branch:*
              ${{ github.ref_name }}

              *Triggered by:*
              ${{ github.actor }}

              *Run:*
              <https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Run>

              *Test Results:*
              :1234: Total        =>  ${{ steps.test-results.outputs.total }}
              :white_check_mark: Passed       =>  ${{ steps.test-results.outputs.passed }}
              :x: Failed        =>  ${{ steps.test-results.outputs.failed }}
              :warning: Flaky        =>  ${{ steps.test-results.outputs.flaky }}
              :black_right_pointing_double_triangle_with_vertical_bar: Skipped      =>  ${{ steps.test-results.outputs.skipped }}
              :bar_chart: Success Rate  =>  ${{ steps.test-results.outputs.success_rate }}%

      # --------------------------------------------------
      # 14. Make workflow fail if Playwright failed
      # --------------------------------------------------
      - name: Fail workflow if tests failed
        if: steps.playwright-tests.outcome == 'failure'
        run: exit 1