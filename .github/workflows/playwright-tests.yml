name: Playwright Tests

on:
  push:
    branches:
      - main

  workflow_dispatch:

  schedule:
    - cron: "30 3 * * *" # 9:00 AM IST daily (UTC+5:30 offset)

jobs:
  test:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-noble
    env:
      HOME: /root

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Fix Git Safe Directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Verify Playwright Version Matches Docker Image
        run: |
          INSTALLED_VERSION=$(npx playwright --version | awk '{print $2}')
          echo "Installed Playwright version: $INSTALLED_VERSION"
          if [[ "$INSTALLED_VERSION" != "1.61.1" ]]; then
            echo "::error::Playwright version ($INSTALLED_VERSION) does not match the Docker image (v1.61.1-noble). Update the image tag or pin package.json."
            exit 1
          fi

      - name: Create Environment File
        run: |
          echo "BASE_URL=${{ secrets.BASE_URL }}" > .env.qe
          echo "API_BASE_URL=https://dummyjson.com" >> .env.qe
          echo "WORKERS=1" >> .env.qe
          echo "CI=true" >> .env.qe

      - name: Run Playwright Tests
        run: npx playwright test

      - name: Parse Test Results
        if: always()
        id: test-results
        run: |
          node << 'SCRIPT'
          const fs = require('fs');

          const filePath = 'test-results/test-results.json';

          if (!fs.existsSync(filePath)) {
            console.log('test-results.json not found, writing zeros');
            const output = [
              'total=0',
              'passed=0',
              'failed=0',
              'flaky=0',
              'skipped=0',
              'percentage=0.0'
            ].join('\n');
            fs.appendFileSync(process.env.GITHUB_OUTPUT, output + '\n');
            process.exit(0);
          }

          const data = JSON.parse(fs.readFileSync(filePath, 'utf8'));
          const stats = data.stats;

          const total = stats.expected + stats.unexpected + stats.flaky + stats.skipped;
          const passed = stats.expected;
          const failed = stats.unexpected;
          const flaky = stats.flaky;
          const skipped = stats.skipped;
          const percentage = total > 0 ? ((passed / total) * 100).toFixed(1) : '0.0';

          const output = [
            `total=${total}`,
            `passed=${passed}`,
            `failed=${failed}`,
            `flaky=${flaky}`,
            `skipped=${skipped}`,
            `percentage=${percentage}`
          ].join('\n');

          fs.appendFileSync(process.env.GITHUB_OUTPUT, output + '\n');
          console.log('Written to GITHUB_OUTPUT:\n' + output);
          SCRIPT

      - name: Upload Playwright HTML Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          retention-days: 30

      - name: Install Java for Allure
        if: always()
        run: |
          apt-get update && apt-get install -y default-jre
          java -version

      - name: Generate Allure HTML Report
        if: always()
        run: npx allure generate allure-results --clean -o allure-report

      - name: Upload Allure Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results/
          retention-days: 30

      - name: Upload Allure HTML Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report/
          retention-days: 30

      - name: Notify Slack
        if: always()
        uses: slackapi/slack-github-action@v2.1.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "attachments": [
                {
                  "color": "${{ job.status == 'success' && 'good' || 'danger' }}",
                  "blocks": [
                    {
                      "type": "header",
                      "text": {
                        "type": "plain_text",
                        "text": "${{ job.status == 'success' && '✅ Playwright Tests — All Passed' || '❌ Playwright Tests — Some Failed' }}"
                      }
                    },
                    {
                      "type": "section",
                      "fields": [
                        { "type": "mrkdwn", "text": "*Repository:*\n${{ github.repository }}" },
                        { "type": "mrkdwn", "text": "*Branch:*\n${{ github.ref_name }}" },
                        { "type": "mrkdwn", "text": "*Triggered by:*\n${{ github.actor }}" },
                        { "type": "mrkdwn", "text": "*Run:*\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Run>" }
                      ]
                    },
                    {
                      "type": "divider"
                    },
                    {
                      "type": "section",
                      "text": {
                        "type": "mrkdwn",
                        "text": "*Test Results:*\n🔢 Total         =>  ${{ steps.test-results.outputs.total }}\n✅ Passed        =>  ${{ steps.test-results.outputs.passed }}\n❌ Failed        =>  ${{ steps.test-results.outputs.failed }}\n⚠️ Flaky          =>  ${{ steps.test-results.outputs.flaky }}\n⏭️ Skipped       =>  ${{ steps.test-results.outputs.skipped }}\n📊 Success Rate  =>  ${{ steps.test-results.outputs.percentage }}%"
                      }
                    }
                  ]
                }
              ]
            }
