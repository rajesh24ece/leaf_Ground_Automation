name: Playwright Tests

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright Tests
        run: npx playwright test
        continue-on-error: true
        env:
          CI: true

      - name: Generate Allure Report
        if: always()
        run: npx allure generate allure-results --clean -o allure-report

      - name: Upload Playwright Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      - name: Upload Allure Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report/
          retention-days: 30

      - name: Calculate Test Results
        if: always()
        id: results
        run: |
          if [ -f "test-results.json" ]; then
            PASSED=$(grep -o '"status":"passed"' test-results.json | wc -l || echo 0)
            FAILED=$(grep -o '"status":"failed"' test-results.json | wc -l || echo 0)
            SKIPPED=$(grep -o '"status":"skipped"' test-results.json | wc -l || echo 0)
          else
            PASSED=0
            FAILED=0
            SKIPPED=0
          fi
          echo "passed=$PASSED" >> $GITHUB_OUTPUT
          echo "failed=$FAILED" >> $GITHUB_OUTPUT
          echo "skipped=$SKIPPED" >> $GITHUB_OUTPUT

      - name: Send Slack Notification
        if: always()
        run: |
          curl -X POST \
            -H "Content-Type: application/json" \
            --data "{\"text\":\"🚀 *Playwright Execution Completed*\n\n📂 *Repository:* ${{ github.repository }}\n🌿 *Branch:* ${{ github.ref_name }}\n👤 *Triggered by:* ${{ github.actor }}\n\n✅ *Passed:* ${{ steps.results.outputs.passed }}\n❌ *Failed:* ${{ steps.results.outputs.failed }}\n⏭️ *Skipped:* ${{ steps.results.outputs.skipped }}\n\n📊 *Job Status:* ${{ job.status }}\n\n🔗 *Workflow Run:*\nhttps://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\n\n📦 Reports available in GitHub Actions Artifacts\"}" \
            "${{ secrets.SLACK_WEBHOOK_URL }}"
