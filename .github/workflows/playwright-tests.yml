name: Playwright Tests

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      WORKERS: 1

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright Tests
        run: npx playwright test
        continue-on-error: true
        env:
          CI: true

      - name: Verify Generated Files
        if: always()
        run: ls -la

      - name: Generate Allure Report
        if: always()
        run: npx allure generate allure-results --clean -o allure-report

      - name: Upload Playwright Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      - name: Upload Allure Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report/
          retention-days: 30

      - name: Calculate Test Results
        if: always()
        id: results
        run: |
          node <<'EOF'
          const fs = require('fs');

          let passed = 0;
          let failed = 0;
          let skipped = 0;

          if (fs.existsSync('test-results.json')) {
            const report = JSON.parse(
              fs.readFileSync('test-results.json', 'utf8')
            );

            function walk(suites) {
              if (!suites) return;
              for (const suite of suites) {
                if (suite.specs) {
                  for (const spec of suite.specs) {
                    for (const test of spec.tests || []) {
                      for (const result of test.results || []) {
                        if (result.status === 'passed')  passed++;
                        if (result.status === 'failed')  failed++;
                        if (result.status === 'skipped') skipped++;
                      }
                    }
                  }
                }
                walk(suite.suites);
              }
            }

            walk(report.suites);
          }

          fs.appendFileSync(
            process.env.GITHUB_OUTPUT,
            `passed=${passed}\nfailed=${failed}\nskipped=${skipped}\n`
          );
          EOF

      - name: Send Slack Notification
        if: always()
        run: |
          curl -X POST \
            -H "Content-Type: application/json" \
            --data "{\"text\":\"🚀 Playwright Execution Completed\n\n📂 Repository: ${{ github.repository }}\n🌿 Branch: ${{ github.ref_name }}\n👤 Triggered By: ${{ github.actor }}\n\n✅ Passed: ${{ steps.results.outputs.passed }}\n❌ Failed: ${{ steps.results.outputs.failed }}\n⏭️ Skipped: ${{ steps.results.outputs.skipped }}\n\n📊 Job Status: ${{ job.status }}\n\n🔗 Workflow Run:\nhttps://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\n\n📦 Reports available in GitHub Actions Artifacts\"}" \
            "${{ secrets.SLACK_WEBHOOK_URL }}"
