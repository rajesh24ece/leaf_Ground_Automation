name: Playwright Tests

on:
  push:
    branches: [main]

  pull_request:
    branches: [main]

  schedule:
    - cron: '30 4 * * 1-5'

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:

      # ============================================================
      # 1. Checkout source code
      # ============================================================
      - name: Checkout code
        uses: actions/checkout@v4


      # ============================================================
      # 2. Setup Node.js
      # ============================================================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm


      # ============================================================
      # 3. Install npm dependencies
      # ============================================================
      - name: Install dependencies
        run: npm ci


      # ============================================================
      # 4. Get installed Playwright version
      # ============================================================
      - name: Get Playwright version
        id: playwright-version
        shell: bash
        run: |
          echo "version=$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test'].version")" >> "$GITHUB_OUTPUT"


      # ============================================================
      # 5. Cache Playwright browsers
      # ============================================================
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}


      # ============================================================
      # 6. Install Playwright browsers
      # ============================================================
      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps


      # ============================================================
      # 7. Install OS dependencies when browser cache exists
      # ============================================================
      - name: Install Playwright OS dependencies only
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps


      # ============================================================
      # 8. Run Playwright tests
      # ============================================================
      - name: Run Playwright tests
        id: playwright-tests
        continue-on-error: true
        run: npx playwright test
        env:
          CI: true
          BASE_URL: ${{ secrets.BASE_URL }}


      # ============================================================
      # 9. Calculate Playwright test results
      #
      # JSON file generated by playwright.config.ts:
      #
      # test-results/test-results.json
      #
      # ============================================================
      - name: Calculate test results
        id: test-results
        if: always()
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');

          const resultFile = 'test-results/test-results.json';
          const outputFile = process.env.GITHUB_OUTPUT;

          console.log('');
          console.log('==========================================');
          console.log('       PLAYWRIGHT RESULT CALCULATION');
          console.log('==========================================');

          // --------------------------------------------------------
          // Check JSON result file
          // --------------------------------------------------------
          if (!fs.existsSync(resultFile)) {
            console.log(`ERROR: ${resultFile} was not found.`);
            console.log('Available files:');

            if (fs.existsSync('test-results')) {
              console.log(
                fs.readdirSync('test-results', {
                  recursive: true
                })
              );
            }

            fs.appendFileSync(outputFile, 'total=0\n');
            fs.appendFileSync(outputFile, 'passed=0\n');
            fs.appendFileSync(outputFile, 'failed=0\n');
            fs.appendFileSync(outputFile, 'flaky=0\n');
            fs.appendFileSync(outputFile, 'skipped=0\n');
            fs.appendFileSync(outputFile, 'success_rate=0.0\n');

            process.exit(0);
          }

          console.log(`Reading: ${resultFile}`);

          // --------------------------------------------------------
          // Read JSON
          // --------------------------------------------------------
          let data;

          try {
            data = JSON.parse(
              fs.readFileSync(resultFile, 'utf8')
            );
          } catch (error) {
            console.log('ERROR: Unable to parse Playwright JSON.');
            console.log(error);

            fs.appendFileSync(outputFile, 'total=0\n');
            fs.appendFileSync(outputFile, 'passed=0\n');
            fs.appendFileSync(outputFile, 'failed=0\n');
            fs.appendFileSync(outputFile, 'flaky=0\n');
            fs.appendFileSync(outputFile, 'skipped=0\n');
            fs.appendFileSync(outputFile, 'success_rate=0.0\n');

            process.exit(0);
          }

          // --------------------------------------------------------
          // Counters
          // --------------------------------------------------------
          let total = 0;
          let passed = 0;
          let failed = 0;
          let flaky = 0;
          let skipped = 0;


          // --------------------------------------------------------
          // Process Playwright suites recursively
          // --------------------------------------------------------
          function processSuite(suite) {

            if (!suite) {
              return;
            }

            // ------------------------------------------------------
            // Process specs
            // ------------------------------------------------------
            if (Array.isArray(suite.specs)) {

              for (const spec of suite.specs) {

                if (!Array.isArray(spec.tests)) {
                  continue;
                }

                for (const test of spec.tests) {

                  total++;

                  const results = Array.isArray(test.results)
                    ? test.results
                    : [];

                  // No execution result
                  if (results.length === 0) {
                    skipped++;
                    continue;
                  }

                  // ------------------------------------------------
                  // Last result is the final execution attempt
                  // ------------------------------------------------
                  const finalResult =
                    results[results.length - 1];

                  const finalStatus =
                    finalResult.status;

                  // ------------------------------------------------
                  // Check whether a previous attempt failed
                  // ------------------------------------------------
                  const hadPreviousFailure =
                    results
                      .slice(0, -1)
                      .some(result =>
                        result.status === 'failed' ||
                        result.status === 'timedOut'
                      );


                  // ------------------------------------------------
                  // SKIPPED
                  // ------------------------------------------------
                  if (finalStatus === 'skipped') {

                    skipped++;

                  }


                  // ------------------------------------------------
                  // FLAKY
                  //
                  // Failed/timed out first and then passed
                  // ------------------------------------------------
                  else if (
                    finalStatus === 'passed' &&
                    hadPreviousFailure
                  ) {

                    flaky++;

                  }


                  // ------------------------------------------------
                  // PASSED
                  // ------------------------------------------------
                  else if (finalStatus === 'passed') {

                    passed++;

                  }


                  // ------------------------------------------------
                  // FAILED
                  // ------------------------------------------------
                  else if (
                    finalStatus === 'failed' ||
                    finalStatus === 'timedOut' ||
                    finalStatus === 'interrupted'
                  ) {

                    failed++;

                  }


                  // ------------------------------------------------
                  // Unknown status
                  // ------------------------------------------------
                  else {

                    console.log(
                      `Unknown test status: ${finalStatus}`
                    );

                    failed++;
                  }
                }
              }
            }


            // ------------------------------------------------------
            // Process child suites
            // ------------------------------------------------------
            if (Array.isArray(suite.suites)) {

              for (const childSuite of suite.suites) {

                processSuite(childSuite);

              }
            }
          }


          // --------------------------------------------------------
          // Start processing
          // --------------------------------------------------------
          processSuite(data);


          // --------------------------------------------------------
          // Success Rate
          //
          // Matches your existing Slack report:
          //
          // 76 Passed / 78 Total = 97.4%
          //
          // Flaky tests are displayed separately.
          // --------------------------------------------------------
          const successRate =
            total > 0
              ? ((passed / total) * 100).toFixed(1)
              : '0.0';


          // --------------------------------------------------------
          // Send values to GitHub Actions
          // --------------------------------------------------------
          fs.appendFileSync(
            outputFile,
            `total=${total}\n`
          );

          fs.appendFileSync(
            outputFile,
            `passed=${passed}\n`
          );

          fs.appendFileSync(
            outputFile,
            `failed=${failed}\n`
          );

          fs.appendFileSync(
            outputFile,
            `flaky=${flaky}\n`
          );

          fs.appendFileSync(
            outputFile,
            `skipped=${skipped}\n`
          );

          fs.appendFileSync(
            outputFile,
            `success_rate=${successRate}\n`
          );


          // --------------------------------------------------------
          // Console output
          // --------------------------------------------------------
          console.log('');
          console.log('==========================================');
          console.log('       PLAYWRIGHT TEST RESULTS');
          console.log('==========================================');
          console.log(`Total        : ${total}`);
          console.log(`Passed       : ${passed}`);
          console.log(`Failed       : ${failed}`);
          console.log(`Flaky        : ${flaky}`);
          console.log(`Skipped      : ${skipped}`);
          console.log(`Success Rate : ${successRate}%`);
          console.log('==========================================');
          console.log('');
          NODE


      # ============================================================
      # 10. Upload Playwright HTML report
      # ============================================================
      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-html-report
          path: playwright-report/
          retention-days: 30


      # ============================================================
      # 11. Upload Allure results
      # ============================================================
      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results/
          retention-days: 30


      # ============================================================
      # 12. Upload screenshots / videos / traces / JSON
      # ============================================================
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          retention-days: 30


      # ============================================================
      # 13. Send detailed Slack notification
      # ============================================================
      - name: Send Slack Notification
        if: always()
        uses: slackapi/slack-github-action@v4.0.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook

          payload: |
            text: |
              ${{ steps.playwright-tests.outcome == 'success' && ':white_check_mark:' || ':x:' }} Playwright Tests — ${{ steps.playwright-tests.outcome == 'success' && 'All Passed' || 'Tests Failed' }}

              *Repository:*
              ${{ github.repository }}

              *Branch:*
              ${{ github.ref_name }}

              *Triggered by:*
              ${{ github.actor }}

              *Run:*
              <https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Run>

              *Test Results:*
              :1234: Total        =>  ${{ steps.test-results.outputs.total }}
              :white_check_mark: Passed       =>  ${{ steps.test-results.outputs.passed }}
              :x: Failed        =>  ${{ steps.test-results.outputs.failed }}
              :warning: Flaky        =>  ${{ steps.test-results.outputs.flaky }}
              :black_right_pointing_double_triangle_with_vertical_bar: Skipped      =>  ${{ steps.test-results.outputs.skipped }}
              :bar_chart: Success Rate =>  ${{ steps.test-results.outputs.success_rate }}%


      # ============================================================
      # 14. Fail GitHub Actions if Playwright tests failed
      #
      # Slack notification happens BEFORE this step because the
      # Slack step uses if: always()
      # ============================================================
      - name: Fail workflow if Playwright tests failed
        if: steps.playwright-tests.outcome == 'failure'
        run: |
          echo "Playwright tests failed."
          exit 1