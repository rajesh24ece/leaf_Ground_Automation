name: Playwright Tests

on:
push:
branches:
- main
- master

pull_request:
branches:
- main
- master

schedule:
- cron: "30 3 * * 1-5" # 9:00 AM IST Monday-Friday

workflow_dispatch:

jobs:
test:
runs-on: ubuntu-latest
timeout-minutes: 60

```
env:
  WORKERS: 1

steps:
  - name: Checkout Repository
    uses: actions/checkout@v4

  - name: Setup Node.js
    uses: actions/setup-node@v4
    with:
      node-version: "lts/*"

  - name: Install Dependencies
    run: npm ci

  - name: Install Playwright Browsers
    run: npx playwright install --with-deps

  - name: Clean Previous Reports
    run: |
      rm -rf playwright-report
      rm -rf allure-results
      rm -rf allure-report

  - name: Run Playwright Tests
    id: playwright
    continue-on-error: true
    run: npx playwright test

  - name: Generate Allure Report
    if: always()
    run: |
      npx allure generate allure-results --clean -o allure-report

  - name: Upload Playwright Report
    if: always()
    uses: actions/upload-artifact@v4
    with:
      name: playwright-report
      path: playwright-report
      retention-days: 30

  - name: Upload Allure Report
    if: always()
    uses: actions/upload-artifact@v4
    with:
      name: allure-report
      path: allure-report
      retention-days: 30

  - name: Calculate Test Results
    if: always()
    id: results
    run: |
      PASSED=$(grep -r '"status":"passed"' allure-results | wc -l || echo 0)
      FAILED=$(grep -r '"status":"failed"' allure-results | wc -l || echo 0)
      BROKEN=$(grep -r '"status":"broken"' allure-results | wc -l || echo 0)

      echo "passed=$PASSED" >> $GITHUB_OUTPUT
      echo "failed=$FAILED" >> $GITHUB_OUTPUT
      echo "broken=$BROKEN" >> $GITHUB_OUTPUT

  - name: Send Slack Notification
    if: always()
    run: |
      curl -X POST \
      -H "Content-type: application/json" \
      --data '{
        "text":"🚀 Playwright Execution Completed\n\n📂 Repository: ${{ github.repository }}\n🌿 Branch: ${{ github.ref_name }}\n\n✅ Passed: ${{ steps.results.outputs.passed }}\n❌ Failed: ${{ steps.results.outputs.failed }}\n⚠️ Broken: ${{ steps.results.outputs.broken }}\n\n📊 Status: ${{ job.status }}\n\n🔗 Workflow Run:\nhttps://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
      }' \
      ${{ secrets.SLACK_WEBHOOK_URL }}
```
